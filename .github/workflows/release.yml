name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build or update
        required: true
        type: string

# A tag such as v0.13.22 releases the desktop app. A tag such as v0.13.22+mobile
# also builds and publishes the Android APK.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run check-types --filter=desktop...

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            script: package:linux
            asset: lunarscribe-linux-x64.zip
          - runner: macos-15
            script: package:macos:arm64
            asset: lunarscribe-macos-arm64.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check the release version
        run: |
          version=$(jq -r .version apps/desktop/package.json)
          release_version=${RELEASE_TAG#v}
          test "${release_version%+mobile}" = "$version"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: apps/desktop/dist/${{ matrix.asset }}
          if-no-files-found: error

  android:
    if: endsWith(inputs.tag || github.ref_name, '+mobile')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASSET: lunarscribe-android-arm64.apk
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check the release version
        run: |
          version=$(jq -r .version apps/mobile/package.json)
          test "$RELEASE_TAG" = "v$version+mobile"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - run: bunx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      # Build only arm64, which skips the native builds for the other three ABIs.
      # R8 and resource shrinking remove unused code. Compressed native libraries
      # take the APK from 43 MB to 28 MB. The JS bundle stays uncompressed, so
      # Hermes can map it at startup.
      - name: Build the APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: >
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          -Pexpo.useLegacyPackaging=true
      - run:
          mv apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    needs: [check, build, android]
    # Publish when the Android job passed, or when a desktop-only tag skipped it.
    if: >
      !cancelled() && needs.check.result == 'success' && needs.build.result ==
      'success' && contains(fromJSON('["success", "skipped"]'),
      needs.android.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum lunarscribe-* > sha256sums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* install.sh --clobber
          else
            gh release create "$RELEASE_TAG" release/* install.sh \
              --verify-tag --title "Lunarscribe $RELEASE_TAG" --notes ""
          fi
          old_asset=$(gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[] | select(.name == "lunarscribe-linux-x86_64.AppImage") | .name')
          if [ -n "$old_asset" ]; then
            gh release delete-asset "$RELEASE_TAG" "$old_asset" --yes
          fi
