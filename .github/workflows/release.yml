name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build or update
        required: true
        type: string

# A tag such as v0.13.22 releases the desktop app. A tag such as v0.13.22+mobile
# also builds and publishes the Android APK. A tag such as v0.13.22+mobile-ota also
# publishes an OTA update of the mobile app's JS to the update server instead of an
# APK. Each build publishes its own asset as soon as it finishes, so a slow or failed
# platform does not hold back the others.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run check-types --filter=desktop...

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            script: package:linux
            asset: lunarscribe-linux-x64.zip
          - runner: macos-latest
            script: package:macos:arm64
            asset: lunarscribe-macos-arm64.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check the release version
        run: |
          version=$(jq -r .version apps/desktop/package.json)
          release_version=${RELEASE_TAG#v}
          release_version=${release_version%+mobile-ota}
          test "${release_version%+mobile}" = "$version"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.script }}
      - name: Publish the asset
        env:
          GH_TOKEN: ${{ github.token }}
        run:
          .github/scripts/publish-asset.sh "apps/desktop/dist/${{ matrix.asset
          }}"

  android:
    needs: check
    if: endsWith(inputs.tag || github.ref_name, '+mobile')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ASSET: lunarscribe-android-arm64.apk
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check the release version
        run: |
          version=$(jq -r .version apps/mobile/package.json)
          test "$RELEASE_TAG" = "v$version+mobile"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      # OTA updates match this runtime, so resolve it from the source, as the ota job does.
      - name: Resolve the runtime
        working-directory: apps/mobile
        run: |
          runtime=$(bun run publish-update runtime)
          echo "RUNTIME=$runtime" >> "$GITHUB_ENV"
      - run: bunx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      # Build only arm64, which skips the native builds for the other three ABIs.
      # R8 and resource shrinking remove unused code. Compressed native libraries
      # take the APK from 43 MB to 28 MB. The JS bundle stays uncompressed, so
      # Hermes can map it at startup.
      - name: Build the APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: >
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          -Pexpo.useLegacyPackaging=true
      # A build that changed a fingerprint input would make the APK reject OTA updates.
      - name: Check the runtime after the build
        working-directory: apps/mobile
        run: test "$(bun run publish-update runtime)" = "$RUNTIME"
      - run:
          mv apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$ASSET"
      - name: Publish the asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-asset.sh "$ASSET"
      - name: Register the runtime with the update server
        working-directory: apps/mobile
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run publish-update register "$RUNTIME"

  ota:
    needs: check
    if: endsWith(inputs.tag || github.ref_name, '+mobile-ota')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One OTA publish at a time; push one mobile tag at a time, since a third queued
    # run replaces the waiting one.
    concurrency:
      group: ota-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check the release version
        run: |
          version=$(jq -r .version apps/mobile/package.json)
          test "$RELEASE_TAG" = "v$version+mobile-ota"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check-types --filter=mobile...
      - name: Publish the OTA update
        working-directory: apps/mobile
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPO_UPDATES_PRIVATE_KEY: ${{ secrets.EXPO_UPDATES_PRIVATE_KEY }}
        run: bun run publish-update publish
